# Marks pull requests that arrive from a fork, so they can be filtered from
# the ones the maintainer opened.
#
# `Scripts/contribute.sh` cannot apply the label itself: labelling is a write
# on *this* repo, and somebody proposing from their fork has no write here.
# So they open it and this puts the label on.
#
# `pull_request_target` runs with this repo's token rather than the fork's,
# which is what makes that possible — and is why nothing here checks the
# fork's code out. It reads two fields of metadata and writes a label.
name: Label fork PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const name = 'from-a-fork'
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color: 'c2e0c6',
                description: "Proposed from somebody's fork",
              })
            } catch (error) {
              // 422 is "already exists", which is the usual case and not a
              // failure. Anything else is worth failing the run over.
              if (error.status !== 422) throw error
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [name],
            })
